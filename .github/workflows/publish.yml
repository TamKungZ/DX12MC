name: Publish

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*\+mc*'
      - 'v[0-9]*.[0-9]*.[0-9]*\+mc*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (X.Y.Z+mcA.B.C or vX.Y.Z+mcA.B.C)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Refuse a tag that already has a release
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?\d+\.\d+\.\d+\+mc\d+\.\d+(\.\d+)?$') {
            throw "'$env:RELEASE_TAG' is not a release tag. Expected X.Y.Z+mcA.B.C or vX.Y.Z+mcA.B.C."
          }
          $response = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "A GitHub release for $env:RELEASE_TAG already exists. Nothing was published or changed."
          }
          if (-not ("$response" -match 'HTTP 404')) {
            throw "Could not check for an existing release: $response"
          }
          # The expected 404 leaves $LASTEXITCODE at 1, which pwsh would return as the step's exit code.
          exit 0

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check tag, commit and version
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          $tagged = git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($head -ne $tagged) { throw "Checked out $head but $env:RELEASE_TAG points to $tagged." }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $mod = (Select-String -Path gradle.properties -Pattern '^mod_version=(.+)$').Matches[0].Groups[1].Value.Trim()
          $mc = (Select-String -Path gradle.properties -Pattern '^minecraft_version=(.+)$').Matches[0].Groups[1].Value.Trim()
          $declared = "$mod+mc$mc"
          if ($declared -ne $version) { throw "Tag $env:RELEASE_TAG does not match mod_version+mc+minecraft_version ($declared) in gradle.properties." }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble release notes
        shell: pwsh
        run: |
          .\.github\scripts\release-notes.ps1 -Tag $env:RELEASE_TAG -Changelog CHANGELOG.md -Output "$env:RUNNER_TEMP\release-notes.md"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        shell: pwsh
        run: |
          .\gradlew.bat "-Dorg.gradle.java.home=$env:JAVA_HOME" "-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64" build javadocJar sourcesJar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import signing key
        shell: pwsh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if (-not $env:GPG_PRIVATE_KEY) { throw "The GPG_PRIVATE_KEY secret is not set." }
          $primary = @($env:GPG_PRIVATE_KEY | gpg --batch --with-colons --import-options show-only --import 2>$null |
            Select-String -Pattern '^fpr:' -Context 1,0 |
            Where-Object { $_.Context.PreContext[0] -match '^sec:' } |
            ForEach-Object { ($_.Line -split ':')[9] })
          if ($primary.Count -eq 0) { throw "GPG_PRIVATE_KEY does not contain a secret key." }
          "IMPORTED_KEYS=$($primary -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GPG_PRIVATE_KEY | gpg --batch --import 2>$null
          if ($LASTEXITCODE -ne 0) { throw "gpg could not import GPG_PRIVATE_KEY." }
          $candidates = ((Select-String -Path gradle.properties -Pattern '^signing_key_candidates=(.+)$').Matches[0].Groups[1].Value -split ',') |
            ForEach-Object { $_.Trim().TrimEnd('!') } | Where-Object { $_ }
          $secret = gpg --batch --with-colons --list-secret-keys 2>$null | Where-Object { $_ -match '^fpr:' } | ForEach-Object { ($_ -split ':')[9] }
          $usable = @($candidates | Where-Object { $secret -contains $_ })
          if ($usable.Count -eq 0) { throw "The imported key matches none of signing_key_candidates in gradle.properties." }
          Write-Host "Signing key available: $($usable[0])"

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          $base = "https://maven.pkg.github.com/$env:GH_REPO/net/dx12mc/dx12mc/$env:RELEASE_VERSION"
          $files = foreach ($suffix in '.jar', '-sources.jar', '-javadoc.jar', '.pom', '.module') {
            "dx12mc-$env:RELEASE_VERSION$suffix"
            "dx12mc-$env:RELEASE_VERSION$suffix.asc"
          }
          $present = @()
          foreach ($file in $files) {
            $status = curl.exe --silent --output NUL --write-out '%{http_code}' --user "${env:GITHUB_ACTOR}:$env:GITHUB_TOKEN" "$base/$file"
            if ($status -eq '200') { $present += $file }
            elseif ($status -ne '404') { throw "GitHub Packages answered $status for $file." }
          }
          if ($present.Count -eq $files.Count) {
            Write-Host "::notice::$env:RELEASE_VERSION is already fully published to GitHub Packages by an earlier run. Skipping the upload."
            exit 0
          }
          if ($present.Count -gt 0) {
            throw "GitHub Packages holds an incomplete $env:RELEASE_VERSION ($($present -join ', ')). Delete that package version, then run this workflow again."
          }
          $gradleArgs = @("-Dorg.gradle.java.home=$env:JAVA_HOME", "-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64", "publishGitHubPackage", "-Pdx12mc.requireSigning=true")
          if ($env:GPG_PASSPHRASE) { $gradleArgs += "-Psigning.gnupg.passphrase=$env:GPG_PASSPHRASE" }
          .\gradlew.bat @gradleArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create the GitHub release
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --notes-file "$env:RUNNER_TEMP\release-notes.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove the signing key
        if: always()
        shell: pwsh
        run: |
          foreach ($fingerprint in ($env:IMPORTED_KEYS -split ',' | Where-Object { $_ })) {
            gpg --batch --yes --delete-secret-and-public-key $fingerprint 2>$null
          }
          gpgconf --kill gpg-agent 2>$null
          exit 0
